services:
  - type: web
    name: parkinson-disease-detection-api

    env: python

    plan: free

    rootDir: backend

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port $PORT

    autoDeploy: true

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: OPENAI_API_KEY
        sync: false
